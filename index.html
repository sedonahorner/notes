<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chartside — Clinical Reference</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%231C2F4A%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 fill=%22%23EAF2F8%22 text-anchor=%22middle%22 font-family=%22Georgia%22>C</text></svg>">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth.js/1.6.0/mammoth.browser.min.js"></script>

<style>
  :root{
    --navy: #1C2F4A;
    --navy-mid: #2E4A73;
    --accent: #4A7BA6;
    --pearl: #EAF2F8;
    --pearl-border: #C9DCEA;
    --flag: #B33A3A;
    --flag-bg: #FBEAEA;
    --paper: #F7F8FA;
    --ink: #1F2937;
    --ink-soft: #6B7280;
    --line: #E2E6EB;
    --radius: 10px;
  }
  *{box-sizing:border-box; font-family:'Times New Roman', Times, serif !important;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',sans-serif; font-size:15px; line-height:1.55;
  }
  h1,h2,h3,h4{ font-family:'Source Serif 4', serif; font-weight:600; color:var(--navy); margin:0 0 .5em; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  a{ color:var(--accent); }
  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---------- App shell ---------- */
  #app{ display:none; }
  .topbar{
    background:var(--navy); color:#fff; padding:14px 20px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    border-bottom: 3px solid var(--navy-mid);
  }
  .topbar h1{ color:#fff; font-size:1.3rem; margin:0; letter-spacing:.02em; }
  .topbar .subtitle{ color:#B9CBDD; font-size:.78rem; margin-left:2px; }
  .topbar-search{ flex:1; min-width:180px; max-width:420px; margin-left:auto; }
  .topbar-search input{
    width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--navy-mid);
    background:#25395A; color:#fff; font-size:.9rem;
  }
  .topbar-search input::placeholder{ color:#9FB4C9; }
  .btn-new{
    background:var(--flag); color:#fff; border:none; padding:9px 16px;
    border-radius:8px; font-weight:600; font-size:.85rem; white-space:nowrap;
  }
  .btn-new:hover{ background:#9c3232; }
  .btn-signout{ background:transparent; border:1px solid #3E5776; color:#CFE0EE; padding:8px 12px; border-radius:8px; font-size:.8rem; }
  .btn-signout:hover{ background:#25395A; }

  .layout{ display:flex; min-height:calc(100vh - 60px); }

  /* Chart-tab sidebar */
  .sidebar{
    width:220px; flex-shrink:0; background:#fff; border-right:1px solid var(--line);
    padding:18px 0;
  }
  .sidebar h2{ font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-family:'Inter'; font-weight:600; padding:0 18px 8px; }
  .tab{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 16px 10px 18px; margin: 0 0 4px 0; cursor:pointer;
    border-left:4px solid transparent; color:var(--navy-mid); font-size:.88rem;
    position:relative;
  }
  .tab:hover{ background:var(--pearl); }
  .tab.active{ background:var(--pearl); border-left-color:var(--flag); font-weight:600; color:var(--navy); }
  .tab .count{ font-family:'IBM Plex Mono'; font-size:.72rem; color:var(--ink-soft); background:#EDEFF2; padding:1px 7px; border-radius:10px; }
  .tab.active .count{ background:var(--pearl-border); color:var(--navy); }

  /* Main content */
  .main{ flex:1; padding:26px 30px 60px; max-width:900px; }
  #bank-view{ margin:0 auto; }
  .main-header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px; flex-wrap:wrap; gap:8px;}
  .empty-state{
    text-align:center; padding:70px 20px; color:var(--ink-soft);
  }
  .empty-state h3{ color:var(--navy); }

  /* Note cards */
  .note-card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:14px; overflow:hidden; transition:box-shadow .15s;
  }
  .note-card:hover{ box-shadow:0 2px 10px rgba(28,47,74,0.07); }
  .note-head{
    padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; cursor:pointer; gap:10px;
  }
  .note-title{ font-family:'Source Serif 4'; font-weight:600; font-size:1.05rem; color:var(--navy); margin:0; }
  .note-meta{ font-size:.76rem; color:var(--ink-soft); margin-top:3px; }
  .note-meta .tag{
    display:inline-block; background:var(--pearl); color:var(--navy-mid); border:1px solid var(--pearl-border);
    padding:1px 8px; border-radius:12px; font-size:.7rem; margin-right:5px; font-family:'IBM Plex Mono';
  }
  .qnum .tag{
    display:inline-block; background:var(--pearl); color:var(--navy-mid); border:1px solid var(--pearl-border);
    padding:1px 8px; border-radius:12px; font-size:.68rem; font-family:'IBM Plex Mono'; text-transform:none; letter-spacing:0;
  }
  .note-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    background:none; border:1px solid var(--line); border-radius:6px; padding:5px 9px; font-size:.78rem; color:var(--navy-mid);
  }
  .icon-btn:hover{ background:var(--pearl); }
  .icon-btn.danger{ color:var(--flag); border-color:#EBC9C9; }
  .icon-btn.danger:hover{ background:var(--flag-bg); }

  /* Question generator */
  .qcard{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; }
  .qcard .qnum{ font-family:'IBM Plex Mono'; font-size:.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; }
  .qcard .qtext{ font-weight:600; margin:6px 0 8px; color:var(--navy); }
  .qcard .qanswer{ background:var(--pearl); border-left:3px solid var(--accent); padding:8px 12px; border-radius:0 6px 6px 0; font-size:.9rem; margin-bottom:10px; display:none; }
  .qcard .qanswer.open{ display:block; }
  .feedback-row{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .fb-btn{ background:none; border:1px solid var(--line); border-radius:6px; padding:5px 10px; font-size:.76rem; color:var(--ink-soft); }
  .fb-btn:hover{ background:var(--paper); }
  .fb-btn.selected{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .calibration-box{ background:var(--pearl); border:1px solid var(--pearl-border); border-radius:8px; padding:12px 14px; margin-bottom:16px; }
  .calibration-box textarea{ width:100%; min-height:60px; border:1px solid var(--pearl-border); border-radius:6px; padding:8px 10px; font-size:.85rem; font-family:inherit; }
  .spinner{ display:inline-block; width:14px; height:14px; border:2px solid var(--pearl-border); border-top-color:var(--navy); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* View tabs */
  .view-tab{
    background:none; border:none; padding:12px 16px; font-size:.88rem; color:var(--ink-soft); font-weight:500;
    border-bottom:3px solid transparent; margin-bottom:-1px;
  }
  .view-tab:hover{ color:var(--navy); }
  .view-tab.active{ color:var(--navy); border-bottom-color:var(--flag); font-weight:600; }
  .view-tab .count{ background:var(--flag); color:#fff; font-family:'IBM Plex Mono'; font-size:.7rem; padding:1px 7px; border-radius:10px; margin-left:6px; }

  /* Bank view */
  .bank-summary{ display:flex; gap:14px; margin-bottom:24px; flex-wrap:wrap; }
  .bank-stat{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 20px; flex:1; min-width:120px; text-align:center; }
  .bank-stat .num{ font-family:'Source Serif 4'; font-size:1.6rem; font-weight:700; color:var(--navy); }
  .bank-stat .label{ font-size:.76rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
  .flashcard{
    background:#fff; border:1px solid var(--line); border-radius:14px; padding:36px 32px; text-align:center;
    box-shadow:0 4px 20px rgba(28,47,74,0.06); max-width:640px; margin:0 auto;
  }
  .flashcard .box-tag{ font-family:'IBM Plex Mono'; font-size:.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-bottom:14px; }
  .flashcard .fc-question{ font-family:'Source Serif 4'; font-size:1.25rem; font-weight:600; color:var(--navy); margin-bottom:18px; line-height:1.4; }
  .flashcard .fc-answer{ background:var(--pearl); border-left:4px solid var(--accent); border-radius:0 8px 8px 0; padding:14px 18px; text-align:left; margin-bottom:20px; display:none; }
  .flashcard .fc-answer.open{ display:block; }
  .fc-grade-row{ display:flex; gap:10px; justify-content:center; }
  .fc-grade{ padding:10px 22px; border-radius:8px; font-weight:600; font-size:.9rem; border:none; }
  .fc-grade.wrong{ background:var(--flag-bg); color:var(--flag); }
  .fc-grade.wrong:hover{ background:#F5D5D5; }
  .fc-grade.right{ background:#E3F0E5; color:#2C6B3F; }
  .fc-grade.right:hover{ background:#CDE6D1; }
  .bank-list-row{
    display:flex; justify-content:space-between; align-items:center; background:#fff; border:1px solid var(--line);
    border-radius:8px; padding:10px 16px; margin-bottom:8px; font-size:.88rem;
  }
  .bank-list-row .bq-text{ flex:1; margin-right:12px; }
  .bank-list-row .bq-meta{ font-family:'IBM Plex Mono'; font-size:.72rem; color:var(--ink-soft); white-space:nowrap; }

  .note-body{ padding:0 18px 18px; border-top:1px solid var(--line); display:none; }
  .note-body.open{ display:block; padding-top:14px; }
  .rendered h1,.rendered h2,.rendered h3{ font-size:1.1rem; margin-top:1em; }
  .rendered table{ border-collapse:collapse; width:100%; margin:10px 0; font-size:.88rem; }
  .rendered th{ background:var(--navy); color:#fff; padding:7px 10px; text-align:left; }
  .rendered td{ padding:6px 10px; border-bottom:1px solid var(--line); }
  .rendered tr:nth-child(even) td{ background:var(--paper); }
  .rendered blockquote{
    background:var(--pearl); border-left:4px solid var(--accent); margin:12px 0; padding:10px 14px; border-radius:0 6px 6px 0; color:var(--navy-mid);
  }
  .rendered code{ background:#EDEFF2; padding:1px 5px; border-radius:4px; font-size:.85em; }
  .rendered img{ max-width:100%; border-radius:8px; border:1px solid var(--line); margin:10px 0; display:block; }
  .rendered p:has(a):has(> a:only-child){ margin: 6px 0; }
  .rendered a{ font-weight:500; }
  .rendered ul, .rendered ol{ padding-left:1.3em; }

  /* Editor */
  .editor-wrap{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:20px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:.78rem; font-weight:600; color:var(--navy-mid); margin-bottom:4px; }
  .field input, .field select{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px; font-size:.9rem; font-family:inherit;
  }
  .split{ display:flex; flex-direction:column; gap:16px; margin-top:6px; }
  .split > div{ flex:1; min-width:0; }
  .split textarea{
    width:100%; height:280px; padding:12px; border:1px solid var(--line); border-radius:7px;
    font-family:'IBM Plex Mono'; font-size:.85rem; line-height:1.6; resize:vertical;
  }
  .preview-box{
    height:280px; overflow-y:auto; border:1px dashed var(--line); border-radius:7px; padding:12px 14px; background:var(--paper);
  }
  .preview-label{ font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:6px; }
  .editor-actions{ display:flex; gap:8px; margin-top:14px; justify-content:flex-end; }
  .btn-primary{ background:var(--navy); color:#fff; border:none; padding:9px 18px; border-radius:7px; font-weight:600; font-size:.85rem; }
  .btn-primary:hover{ background:var(--navy-mid); }
  .btn-secondary{ background:none; border:1px solid var(--line); padding:9px 16px; border-radius:7px; font-size:.85rem; color:var(--ink); }
  .btn-secondary:hover{ background:var(--paper); }

  @media (max-width: 720px){
    .layout{ flex-direction:column; }
    .sidebar{ width:100%; display:flex; overflow-x:auto; padding:10px 8px; border-right:none; border-bottom:1px solid var(--line); }
    .sidebar h2{ display:none; }
    .tab{ border-left:none; border-bottom:4px solid transparent; white-space:nowrap; margin:0 2px; }
    .tab.active{ border-bottom-color:var(--flag); }
    .split{ gap:12px; }
    .main{ padding:18px 14px 60px; }

    .topbar{ padding:12px 14px; gap:10px; }
    .topbar h1{ font-size:1.1rem; }
    .topbar-search{ order:3; max-width:100%; flex-basis:100%; }
    .btn-new, .btn-signout{ padding:11px 14px; font-size:.82rem; }

    .view-tab{ padding:12px 12px; font-size:.85rem; flex:1; text-align:center; }

    .bank-summary{ gap:8px; }
    .bank-stat{ min-width:0; padding:10px 8px; }
    .bank-stat .num{ font-size:1.3rem; }
    .bank-stat .label{ font-size:.68rem; }

    .flashcard{ padding:24px 18px; border-radius:10px; }
    .flashcard .fc-question{ font-size:1.1rem; }
    .fc-grade-row{ flex-direction:column; }
    .fc-grade{ width:100%; padding:14px; font-size:1rem; }

    .bank-list-row{ flex-direction:column; align-items:flex-start; gap:6px; }
    .bank-list-row .bq-meta{ white-space:normal; }

    .icon-btn, .fb-btn{ padding:8px 12px; font-size:.82rem; }
    button{ -webkit-tap-highlight-color: transparent; }
  }

  /* ---------- Auth screen ---------- */
  #auth-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy);
    padding:20px;
  }
  .auth-card{
    background:#fff; border-radius:14px; padding:36px 32px; width:100%; max-width:380px;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .auth-card h1{ font-size:1.5rem; margin-bottom:4px; }
  .auth-card p.sub{ color:var(--ink-soft); font-size:.85rem; margin-bottom:22px; }
  .auth-card .field{ margin-bottom:14px; }
  .auth-toggle{ text-align:center; margin-top:16px; font-size:.83rem; color:var(--ink-soft); }
  .auth-toggle a{ cursor:pointer; }
  .auth-error{ background:var(--flag-bg); color:var(--flag); padding:8px 12px; border-radius:7px; font-size:.82rem; margin-bottom:14px; display:none; }
  .config-card p{ font-size:.85rem; color:var(--ink-soft); line-height:1.6; }
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen" style="display:none;">
  <div class="auth-card">
    <h1>Chartside</h1>
    <p class="sub">Your clinical reference, signed in privately.</p>
    <div class="auth-error" id="auth-error"></div>
    <div class="field"><label>Email</label><input id="auth-email" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="auth-password" type="password" autocomplete="current-password"></div>
    <button class="btn-primary" style="width:100%;" id="auth-submit" onclick="handleAuth()">Sign in</button>
    <div class="auth-toggle">
      <span id="auth-mode-text">First time here?</span> <a id="auth-mode-link" onclick="toggleAuthMode()">Create an account</a>
    </div>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="app">
  <div class="topbar">
    <div>
      <h1>Chartside</h1>
      <div class="subtitle">Personal PEM reference</div>
    </div>
    <div class="topbar-search">
      <input id="search-input" placeholder="Search notes, tags, findings…" oninput="renderNotes()">
    </div>
    <button class="btn-new" onclick="openEditor()">+ New note</button>
    <button class="btn-new" style="background:var(--navy-mid);" onclick="openQuestionGenerator()">+ Generate questions</button>
    <button class="btn-signout" onclick="signOut()">Sign out</button>
  </div>

  <div style="background:#fff; border-bottom:1px solid var(--line); padding:0 20px; display:flex; gap:4px;">
    <button class="view-tab active" id="tab-notes" onclick="switchView('notes')">📝 Notes</button>
    <button class="view-tab" id="tab-bank" onclick="switchView('bank')">📚 Review bank <span id="due-badge" class="count" style="display:none;"></span></button>
  </div>

  <div class="layout" id="notes-view">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div id="editor-slot"></div>
      <div class="main-header">
        <h2 id="section-title" style="margin:0;">All notes</h2>
      </div>
      <div id="notes-list"></div>
    </div>
  </div>

  <div class="main" id="bank-view" style="display:none;">
    <div id="bank-content"></div>
  </div>
</div>

<script>
/* ---------------- Config / Supabase init ---------------- */
const SUPABASE_URL = 'https://rbmmjnekvjskztzmxovh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_szHSGSxd79mPcxlhnJMRVQ_8Stol9_u';

let sb;

let currentUser = null;
let notes = [];
let activeTopic = 'All';
let editingId = null;
let isSignUp = false;

async function init(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const { data: { session } } = await sb.auth.getSession();
  if(session){
    currentUser = session.user;
    showApp();
  } else {
    document.getElementById('auth-screen').style.display='flex';
  }

  sb.auth.onAuthStateChange((event, session) => {
    if(session){ currentUser = session.user; showApp(); }
  });
}

function toggleAuthMode(){
  isSignUp = !isSignUp;
  document.getElementById('auth-submit').textContent = isSignUp ? 'Create account' : 'Sign in';
  document.getElementById('auth-mode-text').textContent = isSignUp ? 'Already have an account?' : 'First time here?';
  document.getElementById('auth-mode-link').textContent = isSignUp ? 'Sign in' : 'Create an account';
}

async function handleAuth(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errBox = document.getElementById('auth-error');
  errBox.style.display = 'none';
  if(!email || !password){ errBox.textContent = 'Enter both email and password.'; errBox.style.display='block'; return; }

  let result;
  if(isSignUp){
    result = await sb.auth.signUp({ email, password });
    if(!result.error && result.data.user && !result.data.session){
      errBox.style.color = 'var(--navy)'; errBox.style.background = 'var(--pearl)';
      errBox.textContent = 'Account created — check your email to confirm, then sign in.';
      errBox.style.display = 'block';
      return;
    }
  } else {
    result = await sb.auth.signInWithPassword({ email, password });
  }
  if(result.error){
    errBox.style.color = 'var(--flag)'; errBox.style.background = 'var(--flag-bg)';
    errBox.textContent = result.error.message;
    errBox.style.display = 'block';
  }
}

async function signOut(){
  await sb.auth.signOut();
  location.reload();
}

async function showApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='block';
  await loadNotes();
  await refreshDueBadge();
}

/* ---------------- Notes CRUD ---------------- */
async function loadNotes(){
  const { data, error } = await sb.from('notes').select('*').order('created_at', { ascending:false });
  if(error){ console.error(error); return; }
  notes = data || [];
  renderSidebar();
  renderNotes();
}

function getTopics(){
  const map = {};
  notes.forEach(n => { const t = n.topic || 'Uncategorized'; map[t] = (map[t]||0)+1; });
  return map;
}

function renderSidebar(){
  const topics = getTopics();
  const sidebar = document.getElementById('sidebar');
  let html = '<h2>Topics</h2>';
  html += `<div class="tab ${activeTopic==='All'?'active':''}" onclick="setTopic('All')"><span>All notes</span><span class="count">${notes.length}</span></div>`;
  Object.keys(topics).sort().forEach(t => {
    html += `<div class="tab ${activeTopic===t?'active':''}" onclick="setTopic('${t.replace(/'/g,"\\'")}')"><span>${escapeHtml(t)}</span><span class="count">${topics[t]}</span></div>`;
  });
  sidebar.innerHTML = html;
}

function setTopic(t){
  activeTopic = t;
  document.getElementById('section-title').textContent = t === 'All' ? 'All notes' : t;
  renderSidebar();
  renderNotes();
}

function renderNotes(){
  const query = document.getElementById('search-input').value.toLowerCase().trim();
  let filtered = notes.filter(n => activeTopic === 'All' || (n.topic || 'Uncategorized') === activeTopic);
  if(query){
    filtered = filtered.filter(n =>
      (n.title||'').toLowerCase().includes(query) ||
      (n.body||'').toLowerCase().includes(query) ||
      (n.tags||[]).join(' ').toLowerCase().includes(query)
    );
  }
  const list = document.getElementById('notes-list');
  if(filtered.length === 0){
    list.innerHTML = `<div class="empty-state"><h3>No notes yet</h3><p>Start building your reference — add your first note.</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(n => `
    <div class="note-card">
      <div class="note-head" onclick="toggleNote('${n.id}')">
        <div>
          <p class="note-title">${escapeHtml(n.title)}</p>
          <div class="note-meta">
            ${(n.tags||[]).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
            <span class="mono">${new Date(n.created_at).toLocaleDateString()}</span>
          </div>
        </div>
        <div class="note-actions" onclick="event.stopPropagation()">

async function uploadFile(event){

  const path = `${currentUser.id}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const { error: uploadError } = await sb.storage.from('note-attachments').upload(path, file);
  if(uploadError){
    statusEl.textContent = '';
    alert('File upload failed: ' + uploadError.message);
    return;
  }
  const { data } = sb.storage.from('note-attachments').getPublicUrl(path);
  const url = data.publicUrl;

  const sizeKB = Math.round(file.size / 1024);
  const textarea = document.getElementById('ed-body');
  const cursorPos = textarea.selectionStart;
  const insertText = `\n📎 [${file.name}](${url}) (${sizeKB} KB)\n`;
  textarea.value = textarea.value.slice(0, cursorPos) + insertText + textarea.value.slice(cursorPos);
  statusEl.textContent = '';

}

async function uploadImage(event){

function handleTabKey(event){
  if(event.key !== 'Tab') return;
  event.preventDefault();
  const textarea = event.target;
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const value = textarea.value;

  if(event.shiftKey){
    // Un-indent: remove up to 2 leading spaces before cursor's line start
    const lineStart = value.lastIndexOf('\n', start - 1) + 1;
    const lineText = value.slice(lineStart, start);
    const removeCount = lineText.match(/^ {1,2}/)?.[0].length || 0;
    textarea.value = value.slice(0, lineStart) + value.slice(lineStart + removeCount);
    textarea.selectionStart = textarea.selectionEnd = start - removeCount;
  } else {
    textarea.value = value.slice(0, start) + '  ' + value.slice(end);
    textarea.selectionStart = textarea.selectionEnd = start + 2;
  }
  updatePreview();
}

  const body = document.getElementById('ed-body').value;

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

async function handleArticleFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('file-status');
  const textarea = document.getElementById('article-text');
  statusEl.textContent = 'Reading file…';

  try {
    let text = '';
    const name = file.name.toLowerCase();

    if(name.endsWith('.pdf')){
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      for(let i = 1; i <= pdf.numPages; i++){
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(' ') + '\n\n';
      }
    } else if(name.endsWith('.docx')){
      const buffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer: buffer });
      text = result.value;
    } else {
      text = await file.text();
    }

    textarea.value = text.trim();
    statusEl.textContent = `Loaded "${file.name}" (${text.trim().split(/\s+/).length} words)`;
  } catch(e){
    statusEl.textContent = '';
    alert('Could not read that file: ' + e.message);
  }
}

async function addTargetedQuestion(){
  const topicRequest = document.getElementById('topic-request').value.trim();
  if(!topicRequest){ alert('Type what you want a question about first.'); return; }
  const articleText = document.getElementById('article-text').value.trim();
  if(!articleText){ alert('Load or paste an article first.'); return; }
  const calibrationNotes = document.getElementById('calibration-notes').value;

  const btn = document.getElementById('topic-btn');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Adding…';

  try {
    const { data, error } = await sb.functions.invoke('generate-questions', {
      body: { articleText, calibrationNotes, topicRequest }
    });
    if(error) throw error;
    const newQ = (data.questions || [])[0];
    if(!newQ){ throw new Error('No question returned.'); }
    generatedQuestions.push({ question: newQ.question, answer: newQ.answer, feedback:null, note:'', dbId:null });
    renderGeneratedQuestions();
    document.getElementById('topic-request').value = '';
  } catch(e){
    alert("Couldn't add that question: " + (e.message || String(e)));
  } finally {
    btn.disabled = false;

async function generateQuestions(){
  const articleText = document.getElementById('article-text').value.trim();
  if(!articleText){ alert('Paste in an article first.'); return; }
  const calibrationNotes = document.getElementById('calibration-notes').value;
  await saveCalibration();

  const btn = document.getElementById('gen-btn');
  const resultsEl = document.getElementById('qgen-results');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Generating…';
  resultsEl.innerHTML = '';

  try {
    const { data: feedbackHistory } = await sb.from('review_questions')
      .select('question, difficulty_feedback, feedback_note, original_question, original_answer')
      .eq('user_id', currentUser.id)
      .or('difficulty_feedback.not.is.null,feedback_note.not.is.null')
      .order('created_at', { ascending:false })
      .limit(15);

    const { data, error } = await sb.functions.invoke('generate-questions', {
      body: { articleText, calibrationNotes, recentFeedback: feedbackHistory || [] }
    });
    if(error) throw error;
    generatedQuestions = (data.questions || []).map(q => ({ ...q, feedback:null, note:'' }));
    renderGeneratedQuestions();
  } catch(e){
    resultsEl.innerHTML = `<p style="color:var(--flag);">Couldn't generate questions: ${escapeHtml(e.message || String(e))}</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate questions';

}

let editingIndices = new Set();

function renderGeneratedQuestions(){
  const resultsEl = document.getElementById('qgen-results');
  if(generatedQuestions.length === 0){ resultsEl.innerHTML=''; return; }
  resultsEl.innerHTML = generatedQuestions.map((q, i) => {
    const isEditing = editingIndices.has(i);
    return `
    <div class="qcard" id="qcard-${i}">
      <div class="qnum">Question ${i+1} ${q.edited ? '<span class="tag" style="margin-left:6px;">edited by you</span>' : ''}</div>
      ${isEditing ? `
        <input type="text" id="edit-q-${i}" value="${escapeAttr(q.question)}" style="width:100%; font-weight:600; color:var(--navy); padding:6px 10px; border:1px solid var(--accent); border-radius:6px; margin:6px 0 8px; font-size:.95rem;">
        <textarea id="edit-a-${i}" style="width:100%; min-height:70px; padding:8px 10px; border:1px solid var(--accent); border-radius:6px; font-size:.88rem; margin-bottom:10px;">${escapeHtml(q.answer)}</textarea>
        <div class="feedback-row">
          <button class="btn-primary" style="padding:5px 12px; font-size:.8rem;" onclick="saveEdit(${i})">Save edit</button>
          <button class="btn-secondary" style="padding:5px 12px; font-size:.8rem;" onclick="cancelEdit(${i})">Cancel</button>
        </div>
      ` : `
        <div class="qtext">${escapeHtml(q.question)}</div>
        <div class="qanswer" id="qa-${i}">${escapeHtml(q.answer)}</div>
        <div class="feedback-row">
          <button class="icon-btn" onclick="toggleAnswer(${i})">Show answer</button>
          <button class="icon-btn" onclick="startEdit(${i})">✏️ Edit</button>
          <span style="width:1px; height:16px; background:var(--line); margin:0 4px;"></span>
          <button class="fb-btn ${q.feedback==='too_easy'?'selected':''}" onclick="setFeedback(${i},'too_easy')">Too easy</button>
          <button class="fb-btn ${q.feedback==='just_right'?'selected':''}" onclick="setFeedback(${i},'just_right')">Just right</button>
          <button class="fb-btn ${q.feedback==='too_hard'?'selected':''}" onclick="setFeedback(${i},'too_hard')">Too hard</button>
          <button class="icon-btn" id="regen-btn-${i}" onclick="regenerateQuestion(${i})" style="margin-left:auto;">↻ Regenerate this one</button>
          <button class="icon-btn danger" onclick="deleteQuestion(${i})">Delete</button>
          <button class="icon-btn" onclick="addQuestionToBank(${i})" id="bank-btn-${i}" ${q.inBank ? 'disabled' : ''}>${q.inBank ? '✓ In bank' : '+ Add to bank'}</button>
        </div>
        <div style="margin-top:8px;">
          <input type="text" placeholder="Optional: what specifically was off about this one?"
            value="${escapeAttr(q.note||'')}"
            onblur="saveQuestionNote(${i}, this.value)"
            style="width:100%; padding:6px 10px; border:1px solid var(--line); border-radius:6px; font-size:.82rem;">
        </div>
      `}

  `;
  }).join('') + `
    <div class="editor-actions">
      <button class="btn-primary" onclick="addAllToBank()">+ Add all to bank</button>
      <button class="btn-secondary" onclick="saveQuestionsAsNote()">Save these as a note too</button>
    </div>
  `;
}

function startEdit(i){
  editingIndices.add(i);
  renderGeneratedQuestions();
}

function cancelEdit(i){
  editingIndices.delete(i);
  renderGeneratedQuestions();
}

async function saveEdit(i){
  const newQuestion = document.getElementById(`edit-q-${i}`).value.trim();
  const newAnswer = document.getElementById(`edit-a-${i}`).value.trim();
  const q = generatedQuestions[i];

  if(!q.edited){
    q.originalQuestion = q.question;
    q.originalAnswer = q.answer;
  }
  q.question = newQuestion;
  q.answer = newAnswer;
  q.edited = true;
  editingIndices.delete(i);
  renderGeneratedQuestions();

  try {
    if(q.dbId){
      await sb.from('review_questions').update({
        question: newQuestion, answer: newAnswer,
        original_question: q.originalQuestion, original_answer: q.originalAnswer,
        difficulty_feedback: 'edited'
      }).eq('id', q.dbId);
    } else {
      const { data } = await sb.from('review_questions').insert({
        user_id: currentUser.id,
        question: newQuestion, answer: newAnswer,
        original_question: q.originalQuestion, original_answer: q.originalAnswer,
        difficulty_feedback: 'edited'
      }).select().single();
      if(data){ q.dbId = data.id; }
    }
  } catch(e){ /* non-blocking */ }
}

function toggleAnswer(i){
  document.getElementById(`qa-${i}`).classList.toggle('open');
}

function deleteQuestion(i){
  generatedQuestions.splice(i, 1);
  renderGeneratedQuestions();
}

async function regenerateQuestion(i){
  const q = generatedQuestions[i];
  const btn = document.getElementById(`regen-btn-${i}`);
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Regenerating…';

  try {
    const articleText = document.getElementById('article-text').value.trim();
    const calibrationNotes = document.getElementById('calibration-notes').value;

    const { data, error } = await sb.functions.invoke('generate-questions', {
      body: {
        articleText,
        calibrationNotes,
        regenerate: {
          question: q.question,
          answer: q.answer,
          feedback: q.feedback,
          note: q.note
        }
      }
    });
    if(error) throw error;
    const replacement = (data.questions || [])[0];
    if(!replacement){ throw new Error('No replacement question returned.'); }

    generatedQuestions[i] = { question: replacement.question, answer: replacement.answer, feedback:null, note:'', dbId:null };
    renderGeneratedQuestions();
  } catch(e){
    alert("Couldn't regenerate: " + (e.message || String(e)));
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

async function ensureQuestionSaved(i){
  const q = generatedQuestions[i];
  if(q.dbId) return q.dbId;
  const { data, error } = await sb.from('review_questions').insert({
    user_id: currentUser.id,
    question: q.question,
    answer: q.answer,
    difficulty_feedback: q.feedback,
    feedback_note: q.note || null
  }).select().single();
  if(!error && data){ generatedQuestions[i].dbId = data.id; }
  return generatedQuestions[i].dbId;
}

async function setFeedback(i, value){
  generatedQuestions[i].feedback = generatedQuestions[i].feedback === value ? null : value;
  renderGeneratedQuestions();
  const id = await ensureQuestionSaved(i);
  if(id){
    await sb.from('review_questions').update({ difficulty_feedback: generatedQuestions[i].feedback }).eq('id', id);
  }
}

async function saveQuestionNote(i, note){
  generatedQuestions[i].note = note;
  const id = await ensureQuestionSaved(i);
  if(id){
    await sb.from('review_questions').update({ feedback_note: note }).eq('id', id);
  }
}

async function addAllToBank(){
  const topic = document.getElementById('qgen-topic')?.value.trim() || 'General';
  const toAdd = generatedQuestions.filter(q => !q.inBank);
  if(toAdd.length === 0){ alert('All questions are already in the bank.'); return; }
  const rows = toAdd.map(q => ({
    user_id: currentUser.id,
    question: q.question,
    answer: q.answer,
    topic,
    box_index: 0,
    next_review_date: new Date().toISOString().slice(0,10)
  }));
  const { error } = await sb.from('bank_cards').insert(rows);
  if(error){ alert('Could not add to bank: ' + error.message); return; }
  generatedQuestions.forEach(q => q.inBank = true);
  renderGeneratedQuestions();
  await refreshDueBadge();
  alert(`Added ${rows.length} question${rows.length===1?'':'s'} to your review bank.`);
}

      <div class="bank-stat"><div class="num">${bankCards.length}</div><div class="label">Total cards</div></div>
      <div class="bank-stat"><div class="num">${dueCards.length}</div><div class="label">Due today</div></div>
      <div class="bank-stat"><div class="num">${Object.keys(topics).length}</div><div class="label">Topics</div></div>
    </div>
    ${dueCards.length > 0 ? `
      <div style="text-align:center; margin-bottom:30px;">
        <button class="btn-primary" style="padding:12px 28px; font-size:.95rem;" onclick="startReview()">Start review (${dueCards.length} due)</button>
      </div>
    ` : `<p style="text-align:center; color:var(--ink-soft); margin-bottom:30px;">Nothing due right now — nice work staying on top of it.</p>`}
    <h3>All cards</h3>
    ${bankCards.length === 0 ? '<p style="color:var(--ink-soft);">No cards yet — generate some questions and click "Add to bank."</p>' :
      bankCards.map(c => `
        <div class="bank-list-row">
          <div class="bq-text">${escapeHtml(c.question)}</div>
          <div class="bq-meta">
            <span class="tag" style="margin-right:8px;">${escapeHtml(c.topic || 'General')}</span>
            box ${c.box_index+1}/${BOX_INTERVALS.length} · next ${c.next_review_date}
            <button class="icon-btn danger" style="margin-left:8px; padding:2px 7px;" onclick="deleteBankCard('${c.id}')">×</button>
          </div>
        </div>
      `).join('')
    }
  `;
}

async function deleteBankCard(id){
  if(!confirm('Remove this card from your review bank?')) return;
  await sb.from('bank_cards').delete().eq('id', id);
  await loadBank();
}

function startReview(){
  reviewQueue = bankCards.filter(c => c.next_review_date <= todayStr());
  reviewIndex = 0;
  renderReviewCard();
}

function renderReviewCard(){
  const content = document.getElementById('bank-content');
  if(reviewIndex >= reviewQueue.length){
    content.innerHTML = `
      <div class="flashcard">
        <h3>Review complete 🎉</h3>
        <p style="color:var(--ink-soft);">You got through ${reviewQueue.length} card${reviewQueue.length===1?'':'s'}.</p>
        <button class="btn-primary" style="margin-top:10px;" onclick="renderBankHome()">Back to bank</button>
      </div>
    `;
    loadBank();
    return;
  }
  const card = reviewQueue[reviewIndex];
  content.innerHTML = `
    <p style="text-align:center; color:var(--ink-soft); font-size:.82rem; margin-bottom:14px;">Card ${reviewIndex+1} of ${reviewQueue.length}</p>
    <div class="flashcard">
      <div class="box-tag">${escapeHtml(card.topic || 'General')} · box ${card.box_index+1}/${BOX_INTERVALS.length}</div>
      <div class="fc-question">${escapeHtml(card.question)}</div>
      <div class="fc-answer" id="fc-answer">${escapeHtml(card.answer)}</div>
      <div id="fc-controls">
        <button class="btn-secondary" onclick="showFlashcardAnswer()">Show answer</button>
      </div>
    </div>
  `;
}

function showFlashcardAnswer(){
  document.getElementById('fc-answer').classList.add('open');
  document.getElementById('fc-controls').innerHTML = `
    <div class="fc-grade-row">
      <button class="fc-grade wrong" onclick="gradeCard(false)">Got it wrong</button>
      <button class="fc-grade right" onclick="gradeCard(true)">Got it right</button>
    </div>
  `;
}

async function gradeCard(correct){
  const card = reviewQueue[reviewIndex];
  const newBox = correct ? Math.min(card.box_index + 1, BOX_INTERVALS.length - 1) : 0;
  const nextDate = new Date();
  nextDate.setDate(nextDate.getDate() + BOX_INTERVALS[newBox]);

  await sb.from('bank_cards').update({
    box_index: newBox,
    next_review_date: nextDate.toISOString().slice(0,10),
    last_reviewed_at: new Date().toISOString(),
    correct_count: (card.correct_count || 0) + (correct ? 1 : 0),
    incorrect_count: (card.incorrect_count || 0) + (correct ? 0 : 1)
  }).eq('id', card.id);

  reviewIndex++;
  renderReviewCard();
}

/* ---------------- Utilities ---------------- */
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

init();
</script>

</html>
